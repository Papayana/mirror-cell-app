<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Sistem Manajemen Service HP Hardware & Software" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mirror Cell" />

  <title>MIRROR CELL - Sistem Manajemen Service HP</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1595079676339-1534801ad6cf?w=192&auto=format&fit=crop&q=80" />

  <!-- External CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">

  <!-- Root App Container -->
  <div id="root"></div>

  <!-- Kode Aplikasi React Anda -->
  <script type="text/babel">
    const App = () => {
      return (
        <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
          <h1 class="text-3xl font-bold text-indigo-500 mb-2">MIRROR CELL</h1>
          <p class="text-zinc-400 max-w-md">
            Sistem Manajemen Service HP Siap Digunakan & Di-build ke APK/AAB.
          </p>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
